<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA Cyber Security Sorting Game (Large Screen Edition)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Kanit:wght@500;700&display=swap');

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #030a16; 
            font-family: 'Kanit', sans-serif; 
            text-align: center; 
            color: #00ffcc; 
            user-select: none;
            touch-action: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameCanvas { 
            background: #051329; 
            display: block; 
            border: 3px solid #00ffcc; 
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.35), inset 0 0 20px rgba(0, 255, 204, 0.15);
        }
    </style>
</head>
<body>

    <!-- ขยาย Canvas เป็น 1400 x 850 เหมาะสมลงตัวกับจอ 24 นิ้ว -->
    <canvas id="gameCanvas" width="1400" height="850"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Web Audio Synthesizer (BGM & SFX Engine) ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let bgmInterval = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    startBGM();
}

function startBGM() {
    if (bgmInterval || !audioCtx) return;
    const bgmNotes = [110, 110, 130.81, 110, 146.83, 110, 130.81, 123.47];
    let noteIndex = 0;

    bgmInterval = setInterval(() => {
        if (gameState !== 'PLAYING') return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(bgmNotes[noteIndex], now);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.23);

        noteIndex = (noteIndex + 1) % bgmNotes.length;
    }, 250);
}

function stopBGM() {
    if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'correct') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);

    } else if (type === 'wrong') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);

    } else if (type === 'tick') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.05);

    } else if (type === 'gameover') {
        stopBGM();
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.25, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.3);
        });
    }
}

// State & Data
let score = 0;
let timeLeft = 60;
let timerInterval = null;
let gameState = 'LOADING'; 

let bins = [];
let masterItems = [];
let activeItems = [];
let selectedItem = null;
let offsetX = 0, offsetY = 0;
let floatingTexts = [];

// Idle Timer
const IDLE_LIMIT = 120;
let idleTime = 0;
let idleInterval = null;

function resetIdleTimer() { idleTime = 0; }
function startIdleMonitor() {
    if (idleInterval) clearInterval(idleInterval);
    idleInterval = setInterval(() => {
        idleTime++;
        if (idleTime >= IDLE_LIMIT && gameState !== 'LOADING') {
            initGame();
        }
    }, 1000);
}

window.addEventListener('touchstart', resetIdleTimer, { passive: true });
window.addEventListener('touchmove', resetIdleTimer, { passive: true });
window.addEventListener('mousedown', resetIdleTimer);
window.addEventListener('mousemove', resetIdleTimer);

async function loadQuestionsFromJSON() {
    try {
        const response = await fetch('questions.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('ไม่สามารถโหลดไฟล์ JSON ได้');
        
        const data = await response.json();
        
        // จัดตำแหน่งถังขยะใหม่ให้ใหญ่ขึ้น (ขนาด 380x160px)
        const binPositions = [
            { x: 60,  y: 630, w: 380, h: 160 },
            { x: 510, y: 630, w: 380, h: 160 },
            { x: 960, y: 630, w: 380, h: 160 }
        ];

        bins = data.bins.map((bin, index) => ({
            ...bin,
            ...binPositions[index]
        }));

        masterItems = data.items;
        initGame();

    } catch (error) {
        console.error(error);
        ctx.fillStyle = '#ff3366';
        ctx.font = 'bold 32px Kanit';
        ctx.textAlign = 'center';
        ctx.fillText('CRITICAL ERROR: Failed to load questions.json', canvas.width / 2, canvas.height / 2);
    }
}

function initGame() {
    score = 0;
    timeLeft = 60;
    gameState = 'PLAYING';
    floatingTexts = [];
    resetIdleTimer();
    startBGM();
    
    // พิกัดเริ่มต้นกล่องคำตอบ 6 กล่อง (ขนาดกล่อง 380x100px ใหญ่ชัดเจน)
    const startPositions = [
        { x: 60,  y: 150 }, { x: 510, y: 150 }, { x: 960, y: 150 },
        { x: 60,  y: 320 }, { x: 510, y: 320 }, { x: 960, y: 320 }
    ];

    const shuffled = [...masterItems].sort(() => 0.5 - Math.random()).slice(0, 6);
    
    activeItems = shuffled.map((item, index) => ({
        ...item,
        x: startPositions[index].x,
        y: startPositions[index].y,
        originX: startPositions[index].x,
        originY: startPositions[index].y,
        w: 380,
        h: 100,
        shakeTime: 0
    }));

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameState === 'PLAYING') {
            timeLeft--;
            if (timeLeft <= 10 && timeLeft > 0) playSound('tick');
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
            }
        }
    }, 1000);

    requestAnimationFrame(renderLoop);
}

function endGame() {
    gameState = 'GAMEOVER';
    clearInterval(timerInterval);
    playSound('gameover');
}

function addFloatingText(text, x, y, color) {
    floatingTexts.push({
        text: text,
        x: x,
        y: y,
        color: color,
        alpha: 1.0,
        scale: 1.3
    });
}

function renderLoop() {
    draw();
    if (gameState === 'PLAYING' || floatingTexts.length > 0) {
        requestAnimationFrame(renderLoop);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background Cyber Grid
    ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
    ctx.lineWidth = 1;
    for(let i = 0; i < canvas.width; i += 50) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for(let j = 0; j < canvas.height; j += 50) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    if (gameState === 'LOADING') {
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 36px "Share Tech Mono", Kanit';
        ctx.textAlign = 'center';
        ctx.fillText('INITIALIZING SYSTEM...', canvas.width / 2, canvas.height / 2);
        return;
    }

    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        // --- Header Bar ---
        ctx.fillStyle = 'rgba(2, 20, 46, 0.85)';
        ctx.fillRect(0, 0, canvas.width, 90);
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 90); ctx.lineTo(canvas.width, 90); ctx.stroke();

        // ฟอนต์คะแนนและเวลาขยายใหญ่ขึ้น (34px)
        ctx.font = 'bold 34px "Share Tech Mono", Kanit';
        ctx.fillStyle = '#00ffcc';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 40, 56);

        ctx.textAlign = 'right';
        ctx.fillStyle = timeLeft <= 10 ? '#ff3366' : '#00ffcc';
        ctx.fillText(`TIME: ${timeLeft}s`, canvas.width - 40, 56);

        // --- Bins (ขยายตัวอักษรเป็น 26px) ---
        bins.forEach(bin => {
            ctx.shadowColor = bin.color || '#00ffcc';
            ctx.shadowBlur = 20;
            
            ctx.fillStyle = 'rgba(5, 25, 50, 0.9)';
            ctx.strokeStyle = bin.color || '#00ffcc';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(bin.x, bin.y, bin.w, bin.h, 14);
            ctx.fill();
            ctx.stroke();

            ctx.shadowBlur = 0;

            ctx.fillStyle = bin.color || '#00ffcc';
            ctx.font = 'bold 26px Kanit';
            ctx.textAlign = 'center';
            ctx.fillText(bin.label, bin.x + bin.w / 2, bin.y + bin.h / 2 + 8);
        });

        // --- Question Items (ขยายตัวอักษรเป็น 22px หนา อ่านง่ายขึ้นมาก) ---
        activeItems.forEach(item => {
            let renderX = item.x;
            
            if (item.shakeTime > 0) {
                renderX += Math.sin(item.shakeTime * 0.8) * 10;
                item.shakeTime--;
            }

            ctx.shadowColor = '#00e5ff';
            ctx.shadowBlur = selectedItem === item ? 30 : 12;

            ctx.fillStyle = 'rgba(10, 35, 70, 0.95)';
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = selectedItem === item ? 4 : 2;
            
            ctx.beginPath();
            ctx.roundRect(renderX, item.y, item.w, item.h, 12);
            ctx.fill();
            ctx.stroke();

            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.font = '700 22px Kanit';
            ctx.textAlign = 'center';

            // ตัดคำ 2 บรรทัดหากยาวเกินไป
            if (item.text.length > 22) {
                const mid = Math.floor(item.text.length / 2);
                let splitPos = item.text.indexOf(' ', mid);
                if (splitPos === -1) splitPos = mid;

                const line1 = item.text.substring(0, splitPos);
                const line2 = item.text.substring(splitPos);
                ctx.fillText(line1, renderX + item.w / 2, item.y + item.h / 2 - 10);
                ctx.fillText(line2, renderX + item.w / 2, item.y + item.h / 2 + 22);
            } else {
                ctx.fillText(item.text, renderX + item.w / 2, item.y + item.h / 2 + 7);
            }
        });

        // --- Floating Text (ขยายเป็น 32px) ---
        floatingTexts.forEach((fx, index) => {
            ctx.save();
            ctx.globalAlpha = fx.alpha;
            ctx.shadowColor = fx.color;
            ctx.shadowBlur = 15;
            ctx.fillStyle = fx.color;
            ctx.font = `bold ${Math.floor(32 * fx.scale)}px "Share Tech Mono", Kanit`;
            ctx.textAlign = 'center';
            ctx.fillText(fx.text, fx.x, fx.y);
            ctx.restore();

            fx.y -= 2.5;
            fx.alpha -= 0.02;
            fx.scale = Math.max(1.0, fx.scale - 0.01);

            if (fx.alpha <= 0) floatingTexts.splice(index, 1);
        });
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(3, 10, 22, 0.94)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 25;
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 55px "Share Tech Mono", Kanit';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION COMPLETE', canvas.width / 2, 260);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 40px Kanit';
        ctx.fillText(`TOTAL SCORE: ${score}`, canvas.width / 2, 380);

        // ปุ่ม Reboot ขนาดใหญ่
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 180, 500, 360, 85, 14);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#030a16';
        ctx.font = 'bold 30px Kanit';
        ctx.fillText('SYSTEM REBOOT', canvas.width / 2, 553);
    }
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    
    // คำนวณ Scale เพื่อรองรับการย่อ/ขยายจอภาพแบบถูกต้องแม่นยำ
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    return {
        x: (touch.clientX - rect.left) * scaleX,
        y: (touch.clientY - rect.top) * scaleY
    };
}

function onStart(e) {
    initAudio();
    const pos = getPos(e);

    if (gameState === 'GAMEOVER') {
        if (pos.x >= canvas.width / 2 - 180 && pos.x <= canvas.width / 2 + 180 &&
            pos.y >= 500 && pos.y <= 585) {
            initGame();
        }
        return;
    }

    activeItems.forEach(item => {
        if (pos.x >= item.x && pos.x <= item.x + item.w && 
            pos.y >= item.y && pos.y <= item.y + item.h) {
            selectedItem = item;
            offsetX = pos.x - item.x;
            offsetY = pos.y - item.y;
        }
    });
}

function onMove(e) {
    if (!selectedItem || gameState !== 'PLAYING') return;
    const pos = getPos(e);
    selectedItem.x = pos.x - offsetX;
    selectedItem.y = pos.y - offsetY;
}

function onEnd() {
    if (!selectedItem || gameState !== 'PLAYING') return;

    let matched = false;
    bins.forEach(bin => {
        if (selectedItem.x + selectedItem.w / 2 >= bin.x &&
            selectedItem.x + selectedItem.w / 2 <= bin.x + bin.w &&
            selectedItem.y + selectedItem.h / 2 >= bin.y &&
            selectedItem.y + selectedItem.h / 2 <= bin.y + bin.h) {

            if (selectedItem.category === bin.id) {
                // --- 1. คำนวณคะแนนตามความไว (ยิ่งตอบเร็ว คะแนนยิ่งเยอะ) ---
                const speedBonus = Math.floor(timeLeft / 5); // ได้โบนัสเพิ่มตามวินาทีที่เหลือ
                const pointsEarned = 10 + speedBonus;
                
                score += pointsEarned;
                playSound('correct');

                // แสดงข้อความเอฟเฟกต์บอกคะแนนที่ได้จริงตามความไว
                addFloatingText(`+${pointsEarned} SPEED BONUS!`, selectedItem.x + selectedItem.w / 2, selectedItem.y, '#00ffcc');
                
                activeItems = activeItems.filter(i => i !== selectedItem);
                matched = true;

                if (activeItems.length === 0) {
                    // --- 2. โบนัสพิเศษเมื่อทำครบทุกข้อ (Clear Time Bonus) ---
                    const clearBonus = timeLeft * 2; // เอาเวลาที่เหลือทั้งหมด x 2 เป็นโบนัสปิดเกม
                    score += clearBonus;
                    
                    endGame();
                }
            } else {
                // --- 3. บทลงโทษเมื่อตอบผิด (หักคะแนน + หักเวลา) ---
                score = Math.max(0, score - 5);
                timeLeft = Math.max(0, timeLeft - 3); // โดนหักเวลาเพิ่ม 3 วินาที
                
                playSound('wrong');
                addFloatingText('-5 PTS / -3s PENALTY!', selectedItem.x + selectedItem.w / 2, selectedItem.y, '#ff3366');
                selectedItem.shakeTime = 15;
            }
        }
    });

    if (!matched) {
        selectedItem.x = selectedItem.originX;
        selectedItem.y = selectedItem.originY;
    }

    selectedItem = null;
}
    
canvas.addEventListener('mousedown', onStart);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onEnd);

canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onEnd);

startIdleMonitor();
loadQuestionsFromJSON();
</script>
</body>
</html>
