<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MFA Cyber Security Sorting Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Kanit:wght@400;600&display=swap');

        body { 
            margin: 0; 
            background: #030a16; 
            font-family: 'Kanit', sans-serif; 
            text-align: center; 
            color: #00ffcc; 
            user-select: none;
            touch-action: none;
            overflow: hidden;
        }
        #gameCanvas { 
            background: #051329; 
            display: block; 
            margin: 10px auto; 
            border: 2px solid #00ffcc; 
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3), inset 0 0 15px rgba(0, 255, 204, 0.1);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="900" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Web Audio Synthesizer (สร้างเสียงเอฟเฟกต์ตื่นเต้น) ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioCtx();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'correct') {
        // เสียงตอบถูก Synth High Beep
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15); // C6
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);

    } else if (type === 'wrong') {
        // เสียงตอบผิด Alarm Bass Buzz
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.3);

    } else if (type === 'tick') {
        // เสียงนับถอยหลัง เตือนเวลา
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.05);

    } else if (type === 'gameover') {
        // เสียงจบเกม Mission Complete Fanfare
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.25, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.3);
        });
    }
}

// State & Data
let score = 0;
let timeLeft = 60;
let timerInterval = null;
let gameState = 'LOADING'; 

let bins = [];
let masterItems = [];
let activeItems = [];
let selectedItem = null;
let offsetX = 0, offsetY = 0;
let floatingTexts = [];

// Idle Timer
const IDLE_LIMIT = 120;
let idleTime = 0;
let idleInterval = null;

function resetIdleTimer() { idleTime = 0; }
function startIdleMonitor() {
    if (idleInterval) clearInterval(idleInterval);
    idleInterval = setInterval(() => {
        idleTime++;
        if (idleTime >= IDLE_LIMIT && gameState !== 'LOADING') {
            initGame();
        }
    }, 1000);
}

window.addEventListener('touchstart', resetIdleTimer, { passive: true });
window.addEventListener('touchmove', resetIdleTimer, { passive: true });
window.addEventListener('mousedown', resetIdleTimer);
window.addEventListener('mousemove', resetIdleTimer);

async function loadQuestionsFromJSON() {
    try {
        const response = await fetch('questions.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('ไม่สามารถโหลดไฟล์ JSON ได้');
        
        const data = await response.json();
        
        const binPositions = [
            { x: 45,  y: 440, w: 240, h: 120 },
            { x: 330, y: 440, w: 240, h: 120 },
            { x: 615, y: 440, w: 240, h: 120 }
        ];

        bins = data.bins.map((bin, index) => ({
            ...bin,
            ...binPositions[index]
        }));

        masterItems = data.items;
        initGame();

    } catch (error) {
        console.error(error);
        ctx.fillStyle = '#ff3366';
        ctx.font = 'bold 24px Kanit';
        ctx.textAlign = 'center';
        ctx.fillText('CRITICAL ERROR: Failed to load questions.json', canvas.width / 2, canvas.height / 2);
    }
}

function initGame() {
    score = 0;
    timeLeft = 60;
    gameState = 'PLAYING';
    floatingTexts = [];
    resetIdleTimer();
    
    const startPositions = [
        { x: 70, y: 110 },  { x: 350, y: 110 }, { x: 630, y: 110 },
        { x: 70, y: 220 },  { x: 350, y: 220 }, { x: 630, y: 220 }
    ];

    // สุ่มเลือก 6 ข้อจากคลัง 40 ข้อ
    const shuffled = [...masterItems].sort(() => 0.5 - Math.random()).slice(0, 6);
    
    activeItems = shuffled.map((item, index) => ({
        ...item,
        x: startPositions[index].x,
        y: startPositions[index].y,
        originX: startPositions[index].x,
        originY: startPositions[index].y,
        w: 200,
        h: 75,
        shakeTime: 0
    }));

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameState === 'PLAYING') {
            timeLeft--;
            if (timeLeft <= 10 && timeLeft > 0) playSound('tick');
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
            }
        }
    }, 1000);

    requestAnimationFrame(renderLoop);
}

function endGame() {
    gameState = 'GAMEOVER';
    clearInterval(timerInterval);
    playSound('gameover');
}

function addFloatingText(text, x, y, color) {
    floatingTexts.push({
        text: text,
        x: x,
        y: y,
        color: color,
        alpha: 1.0,
        scale: 1.2
    });
}

function renderLoop() {
    draw();
    if (gameState === 'PLAYING' || floatingTexts.length > 0) {
        requestAnimationFrame(renderLoop);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
    ctx.lineWidth = 1;
    for(let i = 0; i < canvas.width; i += 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for(let j = 0; j < canvas.height; j += 40) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
    }

    if (gameState === 'LOADING') {
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 28px "Share Tech Mono", Kanit';
        ctx.textAlign = 'center';
        ctx.fillText('INITIALIZING SYSTEM...', canvas.width / 2, canvas.height / 2);
        return;
    }

    if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(2, 20, 46, 0.8)';
        ctx.fillRect(0, 0, canvas.width, 70);
        ctx.strokeStyle = '#00ffcc';
        ctx.beginPath(); ctx.moveTo(0, 70); ctx.lineTo(canvas.width, 70); ctx.stroke();

        ctx.font = 'bold 24px "Share Tech Mono", Kanit';
        ctx.fillStyle = '#00ffcc';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 30, 43);

        ctx.textAlign = 'right';
        ctx.fillStyle = timeLeft <= 10 ? '#ff3366' : '#00ffcc';
        ctx.fillText(`TIME: ${timeLeft}s`, canvas.width - 30, 43);

        bins.forEach(bin => {
            ctx.shadowColor = bin.color || '#00ffcc';
            ctx.shadowBlur = 15;
            
            ctx.fillStyle = 'rgba(5, 25, 50, 0.85)';
            ctx.strokeStyle = bin.color || '#00ffcc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(bin.x, bin.y, bin.w, bin.h, 10);
            ctx.fill();
            ctx.stroke();

            ctx.shadowBlur = 0;

            ctx.fillStyle = bin.color || '#00ffcc';
            ctx.font = 'bold 17px Kanit';
            ctx.textAlign = 'center';
            ctx.fillText(bin.label, bin.x + bin.w / 2, bin.y + bin.h / 2 + 6);
        });

        activeItems.forEach(item => {
            let renderX = item.x;
            
            if (item.shakeTime > 0) {
                renderX += Math.sin(item.shakeTime * 0.8) * 8;
                item.shakeTime--;
            }

            ctx.shadowColor = '#00e5ff';
            ctx.shadowBlur = selectedItem === item ? 25 : 10;

            ctx.fillStyle = 'rgba(10, 35, 70, 0.95)';
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = selectedItem === item ? 3 : 1.5;
            
            ctx.beginPath();
            ctx.roundRect(renderX, item.y, item.w, item.h, 8);
            ctx.fill();
            ctx.stroke();

            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px Kanit';
            ctx.textAlign = 'center';

            // ตัดคำ 2 บรรทัดกรณีข้อความยาว
            const words = item.text.split(' ');
            if (item.text.length > 18) {
                const mid = Math.floor(item.text.length / 2);
                const line1 = item.text.substring(0, mid);
                const line2 = item.text.substring(mid);
                ctx.fillText(line1, renderX + item.w / 2, item.y + item.h / 2 - 4);
                ctx.fillText(line2, renderX + item.w / 2, item.y + item.h / 2 + 16);
            } else {
                ctx.fillText(item.text, renderX + item.w / 2, item.y + item.h / 2 + 5);
            }
        });

        floatingTexts.forEach((fx, index) => {
            ctx.save();
            ctx.globalAlpha = fx.alpha;
            ctx.shadowColor = fx.color;
            ctx.shadowBlur = 12;
            ctx.fillStyle = fx.color;
            ctx.font = `bold ${Math.floor(22 * fx.scale)}px "Share Tech Mono", Kanit`;
            ctx.textAlign = 'center';
            ctx.fillText(fx.text, fx.x, fx.y);
            ctx.restore();

            fx.y -= 2;
            fx.alpha -= 0.025;
            fx.scale = Math.max(1.0, fx.scale - 0.01);

            if (fx.alpha <= 0) floatingTexts.splice(index, 1);
        });
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(3, 10, 22, 0.92)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 40px "Share Tech Mono", Kanit';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION COMPLETE', canvas.width / 2, 190);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px Kanit';
        ctx.fillText(`TOTAL SCORE: ${score}`, canvas.width / 2, 270);

        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 130, 360, 260, 65, 10);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#030a16';
        ctx.font = 'bold 22px Kanit';
        ctx.fillText('SYSTEM REBOOT', canvas.width / 2, 401);
    }
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return {
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top
    };
}

function onStart(e) {
    initAudio(); // กระตุ้น Web Audio API เมื่อสัมผัสครั้งแรก
    const pos = getPos(e);

    if (gameState === 'GAMEOVER') {
        if (pos.x >= canvas.width / 2 - 130 && pos.x <= canvas.width / 2 + 130 &&
            pos.y >= 360 && pos.y <= 425) {
            initGame();
        }
        return;
    }

    activeItems.forEach(item => {
        if (pos.x >= item.x && pos.x <= item.x + item.w && 
            pos.y >= item.y && pos.y <= item.y + item.h) {
            selectedItem = item;
            offsetX = pos.x - item.x;
            offsetY = pos.y - item.y;
        }
    });
}

function onMove(e) {
    if (!selectedItem || gameState !== 'PLAYING') return;
    const pos = getPos(e);
    selectedItem.x = pos.x - offsetX;
    selectedItem.y = pos.y - offsetY;
}

function onEnd() {
    if (!selectedItem || gameState !== 'PLAYING') return;

    let matched = false;
    bins.forEach(bin => {
        if (selectedItem.x + selectedItem.w / 2 >= bin.x &&
            selectedItem.x + selectedItem.w / 2 <= bin.x + bin.w &&
            selectedItem.y + selectedItem.h / 2 >= bin.y &&
            selectedItem.y + selectedItem.h / 2 <= bin.y + bin.h) {

            if (selectedItem.category === bin.id) {
                score += 10;
                playSound('correct');
                addFloatingText('+10 ACCESS GRANTED!', selectedItem.x + selectedItem.w / 2, selectedItem.y, '#00ffcc');
                activeItems = activeItems.filter(i => i !== selectedItem);
                matched = true;

                if (activeItems.length === 0) {
                    endGame();
                }
            } else {
                score = Math.max(0, score - 5);
                playSound('wrong');
                addFloatingText('-5 ACCESS DENIED!', selectedItem.x + selectedItem.w / 2, selectedItem.y, '#ff3366');
                selectedItem.shakeTime = 15;
            }
        }
    });

    if (!matched) {
        selectedItem.x = selectedItem.originX;
        selectedItem.y = selectedItem.originY;
    }

    selectedItem = null;
}

canvas.addEventListener('mousedown', onStart);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onEnd);

canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onEnd);

startIdleMonitor();
loadQuestionsFromJSON();
</script>
</body>
</html>
